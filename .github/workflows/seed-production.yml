name: Seed production dailies

# Manually reseed the production schedule with a continuous, forward-looking window
# of dailies. This is the interim stand-in for the generation pipeline cron (#32):
# run it whenever "today" has outrun the scheduled dates (the home page falls back to
# an archive board) to fill the gap and restore runway.
#
# Runnable from a phone: GitHub mobile app / web → Actions → this workflow → "Run
# workflow". No terminal needed.
#
# It seeds over the REST API with the service_role key, so NO database password or
# connection string is involved — a hosted project's direct database host is IPv6-only
# (unreachable from a runner) and the pooler route needs a DB password, both of which
# this sidesteps entirely.
#
# One-time setup: two repository secrets (Settings → Secrets and variables → Actions):
#   * SUPABASE_SECRET_KEY — the service_role / secret API key. Supabase dashboard →
#     Project Settings → API keys. This is the same key the deployment already uses;
#     docs/deployment.md notes it is the one credential this repo's automation holds.
#   * PUBLIC_SUPABASE_URL — the project URL, e.g. https://<ref>.supabase.co (same page).
#
# The seed is idempotent: it only inserts missing puzzles and schedule rows, never
# updates or deletes, so re-running is safe and only fills gaps.

on:
  workflow_dispatch:
    inputs:
      past_days:
        description: 'Days of archive to seed behind today'
        required: false
        default: '21'
      future_days:
        description: 'Days of runway to seed ahead of today'
        required: false
        default: '14'

# Never let two reseeds race against the same database.
concurrency:
  group: seed-production
  cancel-in-progress: false

jobs:
  seed:
    name: Seed the production schedule
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the secrets are configured
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
        run: |
          missing=""
          [ -z "$SUPABASE_SECRET_KEY" ] && missing="$missing SUPABASE_SECRET_KEY"
          [ -z "$PUBLIC_SUPABASE_URL" ] && missing="$missing PUBLIC_SUPABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings → Secrets and variables → Actions (see this workflow's header for where to find the values)."
            exit 1
          fi

      - name: Seed dailies
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SEED_PAST_DAYS: ${{ github.event.inputs.past_days }}
          SEED_FUTURE_DAYS: ${{ github.event.inputs.future_days }}
        run: npm run seed:remote
